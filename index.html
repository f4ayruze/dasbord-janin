<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Monitoring Janin</title>
  
  <!-- Memanggil Library Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
    .card { border: 1px solid #ccc; border-radius: 10px; padding: 20px; width: 300px; margin: 0 auto; box-shadow: 2px 2px 10px #aaa; }
    h1 { color: #333; }
    .value { font-size: 2em; font-weight: bold; color: #007BFF; }
  </style>
</head>
<body>

  <h1>Monitoring Gerak & Jantung Janin</h1>
  
  <div class="card">
    <h3>Device ID: 20</h3>
    <p>Total Gerakan:</p>
    <div class="value" id="gerakVal">0</div>
    
    <p>Nilai Sensor (BPM):</p>
    <div class="value" id="sensorVal">0</div>
  </div>

  <script>
    // --- GANTI DENGAN KUNCI FIREBASE ANDA ---
    var firebaseConfig = {
      apiKey: "AIzaSyCPgchcaIP6ChgIYwtJWJSAPiyc-OKY6ZU", 
      databaseURL: "https://data-gerak-dan-bpm-janin-default-rtdb.asia-southeast1.firebasedatabase.app" // Ganti dengan URL Database Anda
    };
    
    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();
    
    // Membaca data dari path yang sama dengan ESP32
    var dataRef = database.ref('Data_Janin/Device_20');
    
    // Fungsi ini akan otomatis berjalan setiap kali ada data baru di Firebase
    dataRef.on('value', (snapshot) => {
      var data = snapshot.val();
      if(data) {
        document.getElementById('gerakVal').innerText = data.muscleMovements || 0;
        document.getElementById('sensorVal').innerText = data.sensorValue || 0;
      }
    });
  </script>

</body>
</html>
